name: PR

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The runner already has the Android SDK; accept licences so Gradle can download missing platforms/build-tools.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - name: Build Direct release
        run: ./gradlew assembleDirectRelease

      - name: Unit tests
        run: ./gradlew testDirectDebugUnitTest

      - name: Guard - Direct APK has no network permissions
        run: |
          APK=$(ls app/build/outputs/apk/direct/release/*.apk | head -n1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -n1)
          PERMS=$("$AAPT2" dump permissions "$APK")
          echo "$PERMS"
          if echo "$PERMS" | grep -E "INTERNET|ACCESS_NETWORK_STATE"; then
            echo "::error::Direct APK must not request network permissions"; exit 1
          fi

      - name: Guard - no Play / Firebase code in Direct
        run: |
          DEPS=$(./gradlew -q :app:dependencies --configuration directReleaseRuntimeClasspath)
          if echo "$DEPS" | grep -E "com.google.android.gms|com.android.billingclient|firebase"; then
            echo "::error::Direct build must not depend on Play Services, Billing or Firebase"; exit 1
          fi

      - name: Guard - Direct APK size budget (8 MB)
        run: |
          APK=$(ls app/build/outputs/apk/direct/release/*.apk | head -n1)
          SIZE=$(stat -c%s "$APK")
          echo "Direct APK: $SIZE bytes"
          [ "$SIZE" -le 8388608 ] || { echo "::error::Direct APK exceeds 8 MB"; exit 1; }
